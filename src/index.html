<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heko</title>
        <link rel="stylesheet" href="css/main.css">
        <script type="module" src="js/renderer/main.js"></script>
    </head>
    <body>
        <header class="frame">
            <div class="drag-area">
                <p class="window-title">Heko</p>
            </div>
            <div class="button-container">
                <button id="minimize-window-button" tabindex="-1">
                    <svg class="fill" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000"><path d="M4 10v1h8v-1z" style="line-height: normal; font-variant-ligatures: normal; font-variant-position: normal; font-variant-caps: normal; font-variant-numeric: normal; font-variant-alternates: normal; font-feature-settings: normal; text-indent: 0px; text-align: start; text-decoration-line: none; text-decoration-style: solid; text-decoration-color: rgb(0, 0, 0); text-transform: none; text-orientation: mixed; isolation: auto; mix-blend-mode: normal; --darkreader-inline-color: #e8e6e3; --darkreader-inline-fill: #60686c;" color="#000000" font-weight="400" font-family="sans-serif" white-space="normal" overflow="visible" fill="#FF0000" data-darkreader-inline-color="" data-darkreader-inline-fill=""></path></svg>
                </button>
                <button id="maximize-window-button" tabindex="-1">
                    <svg class="fill" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000"><path d="M4 4v8h8V4zm1 1h6v6H5z" style="line-height: normal; font-variant-ligatures: normal; font-variant-position: normal; font-variant-caps: normal; font-variant-numeric: normal; font-variant-alternates: normal; font-feature-settings: normal; text-indent: 0px; text-align: start; text-decoration-line: none; text-decoration-style: solid; text-decoration-color: rgb(0, 0, 0); text-transform: none; text-orientation: mixed; isolation: auto; mix-blend-mode: normal; --darkreader-inline-color: #e8e6e3; --darkreader-inline-fill: #60686c;" color="#000000" font-weight="400" font-family="sans-serif" white-space="normal" overflow="visible" fill="#FF0000" data-darkreader-inline-color="" data-darkreader-inline-fill=""></path></svg>
                </button>
                <button id="close-window-button" tabindex="-1">
                    <svg class="fill" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000"><path d="M4.795 3.912l-.883.883.147.146L7.117 8 4.06 11.059l-.147.146.883.883.146-.147L8 8.883l3.059 3.058.146.147.883-.883-.147-.146L8.883 8l3.058-3.059.147-.146-.883-.883-.146.147L8 7.117 4.941 4.06z" style="line-height: normal; font-variant-ligatures: normal; font-variant-position: normal; font-variant-caps: normal; font-variant-numeric: normal; font-variant-alternates: normal; font-feature-settings: normal; text-indent: 0px; text-align: start; text-decoration-line: none; text-decoration-style: solid; text-decoration-color: rgb(0, 0, 0); text-transform: none; text-orientation: mixed; isolation: auto; mix-blend-mode: normal; --darkreader-inline-color: #e8e6e3; --darkreader-inline-fill: #60686c;" color="#000000" font-weight="400" font-family="sans-serif" white-space="normal" overflow="visible" fill="#FF0000" fill-rule="evenodd" data-darkreader-inline-color="" data-darkreader-inline-fill=""></path></svg>
                </button>
            </div>
        </header>
        <main>
            <aside class="aside-container">
                <header class="aside-container-playlists-manager-container manager-container">
                    <h1>Playlists</h1>
                    <button id="aside-container-playlists-manager-add-button"><img src="assets/plus.svg" alt="add"></button>
                </header>
                <article class="aside-container-playlists-wrapper">
                    <ul id="aside-container-playlists-container"></ul>
                </article>
                <footer class="aside-container-songs-manager-container manager-container">
                    <h1>Songs</h1>
                    <button id="aside-container-songs-manager-settings-button"><img src="assets/ellipsis.svg" alt="ellipsis.svg"></button>
                </footer>
                <footer class="aside-container-artists-manager-container manager-container">
                    <h1>Artists</h1>
                    <button id="aside-container-artists-manager-settings-button"><img src="assets/ellipsis.svg" alt="ellipsis.svg"></button>
                </footer>
            </aside>
            <section id="current-playlist-container" class="song-playlist">
                <header class="current-playlist-details-container">
                    <div id="current-playlist-thumbnail" class="thumbnail null-thumbnail"></div>
                    <h1 id="current-playlist-title" class="one-line-text"></h1>
                    <button id="settings-button"><img src="assets/account.svg" alt="settings"></button>
                    <div class="current-playlist-details-bottom-line-container">
                        <h2 id="current-playlist-count" class="one-line-text"></h2>
                        <h2 id="current-playlist-duration" class="one-line-text"></h2>
                        <button id="current-playlist-add-button"><img src="assets/plus.svg" alt="add"></button>
                    </div>
                </header>
                <header class="current-playlist-options-container">
                    <button id="current-playlist-play-button"><img src="assets/play.svg" alt="play"></button>
                    <input type="text" name="current-playlist-filter-input" id="current-playlist-filter-input" placeholder="Filter …" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off">
                </header>
                <article class="current-playlist-song-table-container">
                    <div class="current-playlist-song-table">
                        <header class="current-playlist-song-table-header">
                            <button id="current-playlist-header-id-button">#</button>
                            <button id="current-playlist-header-title-button" class="song-playlist-button">Title</button>
                            <button id="current-playlist-header-artist-button" class="song-playlist-button">Artist</button>
                            <button class="current-playlist-header-empty-button merged-playlist-button"></button>
                            <button class="current-playlist-header-empty-button merged-playlist-button"></button>
                            <button id="current-playlist-header-name-button" class="merged-playlist-button">Name</button>
                            <button id="current-playlist-header-songs-button" class="merged-playlist-button">Songs</button>
                            <button id="current-playlist-header-duration-button">Duration</button>
                        </header>
                        <ul id="current-playlist-song-table-rows-container"></ul>
                    </div>
                </article>
            </section>
            <footer class="parameters-container">
                <article class="current-song-details-container">
                    <h2 id="current-song-title" class="one-line-text"></h2>
                    <h3 id="current-song-artist" class="one-line-text"></h3>
                </article>
                <article class="main-parameters-container">
                    <div class="main-parameters-top-container">
                        <button id="shuffle-playlist-button" class="false"><img src="assets/shuffle-false.svg" class="false" alt="shuffle"><img src="assets/shuffle-true.svg" class="true" alt="shuffle"></button>
                        <button id="previous-song-button"><img src="assets/previous.svg" alt="previous"></button>
                        <button id="play-song-button" class="paused"><img src="assets/play.svg" class="paused" alt="playing"><img src="assets/pause.svg" class="playing" alt="paused"></button>
                        <button id="next-song-button"><img src="assets/next.svg" alt="next"></aside></button>
                        <button id="loop-song-button" class="false"><img src="assets/loop-false.svg" class="false" alt="loop"><img src="assets/loop-true.svg" class="true" alt="loop"></button>
                    </div>
                    <div class="main-parameters-bottom-container">
                        <p id="current-song-current-time" class="one-line-text">&nbsp;</p>
                        <input type="range" name="current-song-slider" id="current-song-slider" value="0">
                        <p id="current-song-duration" class="one-line-text">&nbsp;</p>
                    </div>
                </article>
                <article class="secondary-parameters-container">
                    <button id="queue-button"><img src="assets/queue.svg" alt="queue"></button>
                    <button id="audio-transform-button"><img src="assets/audio-transform.svg" alt="audio-transform"></button>
                    <div class="volume-container">
                        <button id="mute-button" class="muted"><img src="assets/muted.svg" class="muted" alt="muted"><img src="assets/low-volume.svg" class="low-volume" alt="low-volume"><img src="assets/high-volume.svg" class="high-volume" alt="high-volume"></button>
                        <input type="range" name="volume-slider" id="volume-slider" value="0">
                    </div>
                </article>
            </footer>
        </main>
    </body>
</html>
